[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batfish-q-mcp"
version = "0.1.0"
description = "MCP server for Batfish: questions, assertions, topology, and failure testing as tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Maen Artimy" }]
keywords = ["mcp", "model-context-protocol", "batfish", "network-automation", "network-verification", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "pybatfish",
    "fastmcp>=4,<5",
    "pandas",
    "pyyaml",
    "networkx",
]

[project.scripts]
batfish-q-mcp = "batfish_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/martimy/batfish-q-mcp"
Repository = "https://github.com/martimy/batfish-q-mcp"
Issues = "https://github.com/martimy/batfish-q-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
